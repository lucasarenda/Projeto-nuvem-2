# Toda configuração sensível ou que muda por ambiente vem de variáveis de ambiente.
# Nenhuma senha, chave ou endereço fixo fica no repositório (RNF-02 / RNF-03).
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: doaperto-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doaperto}
    username: ${DB_USERNAME:doaperto}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # colunas TIMESTAMP (sem fuso) guardando instantes em UTC
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${S3_DOWNLOAD_URL_TTL:60m}
    max-upload-bytes: ${S3_MAX_UPLOAD_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.nuvem: INFO
